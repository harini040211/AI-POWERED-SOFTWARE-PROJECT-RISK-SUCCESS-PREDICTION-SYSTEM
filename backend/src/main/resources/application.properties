# ===================================================================
# AI Risk Tracker - Application Configuration
# ===================================================================

# Server Configuration
server.port=${PORT:8080}

# ===================================================================
# Database Configuration - H2 (embedded, file-based)
# ===================================================================
# No installation needed. The database file is created automatically
# on first run inside backend/data/. Sample data is seeded automatically
# by DataInitializer.java the first time the app starts.
spring.datasource.url=jdbc:h2:file:./data/risktracker
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# H2 web console - browse the live database at http://localhost:8080/h2-console
# JDBC URL to use in the console login screen: jdbc:h2:file:./data/risktracker
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===================================================================
# Optional: switch to MySQL instead of H2
# ===================================================================
# 1. Create a database:  CREATE DATABASE risk_tracker;
# 2. Comment out the H2 block above and uncomment the block below.
# 3. Update the username/password to match your MySQL install.
#
# spring.datasource.url=jdbc:mysql://localhost:3306/risk_tracker?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=YOUR_MYSQL_PASSWORD
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Ollama Configuration (optional local AI - app works fine without it)
ollama.url=http://localhost:11434/api/generate
ollama.model=llama3
ollama.timeout=60000

# Risk Thresholds
risk.threshold.low=5
risk.threshold.medium=12

# Resource Utilization Thresholds
resource.threshold.underutilized=70
resource.threshold.optimal.min=71
resource.threshold.optimal.max=90
resource.threshold.high=91
resource.threshold.overloaded=100

# Budget Warning Thresholds
budget.threshold.warning=80
budget.threshold.critical=100

# Logging
logging.level.com.risktracker=DEBUG
logging.level.org.springframework.web=INFO
