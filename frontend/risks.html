<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Risks - AI Risk Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="stylesheet" href="professional-styles.css">
    <style>
        .risk-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            border-left: 5px solid;
        }
        
        .risk-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.15);
        }
        
        .risk-card.severity-low { border-color: #10b981; }
        .risk-card.severity-medium { border-color: #f59e0b; }
        .risk-card.severity-high { border-color: #ef4444; }
        
        .severity-badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        
        .severity-low { background: #d1fae5; color: #059669; }
        .severity-medium { background: #fef3c7; color: #d97706; }
        .severity-high { background: #fee2e2; color: #dc2626; }
        
        .risk-score {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 60px;
            height: 60px;
            border-radius: 12px;
            font-size: 1.5rem;
            font-weight: 700;
            color: white;
        }
        
        .risk-score.low { background: linear-gradient(135deg, #10b981, #059669); }
        .risk-score.medium { background: linear-gradient(135deg, #f59e0b, #d97706); }
        .risk-score.high { background: linear-gradient(135deg, #ef4444, #dc2626); }
    </style>
</head>
<body>
    <!-- Sidebar (same as other pages) -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo-container">
                <div class="logo-icon"><i class="bi bi-shield-check"></i></div>
                <div class="logo-text">
                    <div class="logo-title">AI Risk Tracker</div>
                    <div class="logo-subtitle">Enterprise Edition</div>
                </div>
            </div>
        </div>
        <div class="user-profile">
            <div class="user-avatar"><i class="bi bi-person-circle"></i></div>
            <div class="user-info">
                <div class="user-name" id="userName">Loading...</div>
                <div class="user-role" id="userRole">Role</div>
            </div>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item"><i class="bi bi-speedometer2"></i><span>Dashboard</span></a>
            <a href="projects.html" class="nav-item"><i class="bi bi-folder"></i><span>Projects</span></a>
            <a href="risks.html" class="nav-item active"><i class="bi bi-exclamation-triangle"></i><span>Risks</span></a>
            <a href="resources.html" class="nav-item"><i class="bi bi-people"></i><span>Resources</span></a>
            <a href="users.html" class="nav-item" id="usersMenu"><i class="bi bi-person-gear"></i><span>User Management</span></a>
            <a href="analytics.html" class="nav-item"><i class="bi bi-graph-up"></i><span>Analytics</span></a>
            <a href="reports.html" class="nav-item"><i class="bi bi-file-earmark-text"></i><span>Reports</span></a>
        </nav>
        <div class="sidebar-footer">
            <button class="logout-btn" onclick="logout()"><i class="bi bi-box-arrow-right"></i><span>Logout</span></button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="top-bar">
            <button class="menu-toggle" onclick="toggleSidebar()"><i class="bi bi-list"></i></button>
            <div class="page-title">
                <h1 class="animate__animated animate__fadeInDown">Risk Management</h1>
                <p class="text-muted">Identify, assess, and mitigate project risks</p>
            </div>
            <div class="top-bar-actions">
                <button class="btn-primary" onclick="showAddModal()">
                    <i class="bi bi-plus-lg"></i> New Risk
                </button>
            </div>
        </div>

        <div id="risksContainer"></div>
    </div>

    <!-- Add/Edit Risk Modal -->
    <div class="modal fade" id="riskModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Add New Risk</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="riskForm">
                        <input type="hidden" id="riskId">
                        <div class="mb-3">
                            <label class="form-label">Project</label>
                            <select class="form-select" id="projectId" required></select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Risk Title</label>
                            <input type="text" class="form-control" id="riskTitle" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" id="description" rows="3" required></textarea>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Category</label>
                                <select class="form-select" id="category" required>
                                    <option value="TECHNICAL">Technical</option>
                                    <option value="FINANCIAL">Financial</option>
                                    <option value="OPERATIONAL">Operational</option>
                                    <option value="LEGAL">Legal</option>
                                    <option value="REPUTATIONAL">Reputational</option>
                                </select>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Severity</label>
                                <select class="form-select" id="severity" required>
                                    <option value="LOW">Low</option>
                                    <option value="MEDIUM">Medium</option>
                                    <option value="HIGH">High</option>
                                </select>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Status</label>
                                <select class="form-select" id="status" required>
                                    <option value="IDENTIFIED">Identified</option>
                                    <option value="ASSESSED">Assessed</option>
                                    <option value="MITIGATED">Mitigated</option>
                                    <option value="CLOSED">Closed</option>
                                </select>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Probability (0-100)</label>
                                <input type="number" class="form-control" id="probability" min="0" max="100" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Impact (1-10)</label>
                                <input type="number" class="form-control" id="impact" min="1" max="10" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Mitigation Strategy</label>
                            <textarea class="form-control" id="mitigationStrategy" rows="2"></textarea>
                        </div>
                        <div class="text-end mt-4">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn-save ms-2">Save Risk</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="auth.js"></script>
    <script src="risks.js"></script>
</body>
</html>
